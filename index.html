<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bondhu Bonk! 🔨</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>🔨 Bondhu Bonk!</h1>
  <p class="sub">Gorto theke bondhura ber hobe, tader mathay bonk koro! 💸 Bill hit korle point minus!</p>
  <div class="bar">
    <div class="pill">⏱ <span id="time">30</span>s</div>
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">🔥 <span id="combo">0</span>x</div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="toast">Start dao, dekhi kar mathay age bonk porbe 😈</div>
  <div style="margin-top:14px"><button id="start">▶ Shuru Koro</button></div>
  <div id="end">
    <h2>Game Shesh! 🎉</h2>
    <div>Tomar score: <b id="fs">0</b></div>
    <div class="rank" id="rank"></div>
    <div id="most" style="margin-top:8px"></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
